<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OBS Source Profiler — Live Stats</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #16181d; color: #e6e8ee; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 12px 16px; background: #1d2027; border-bottom: 1px solid #2c3038; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  input { background: #11131a; color: #e6e8ee; border: 1px solid #343a45;
          border-radius: 6px; padding: 6px 9px; }
  button { background: #3a6df0; color: #fff; border: 0; border-radius: 6px;
           padding: 7px 14px; cursor: pointer; }
  button.disconnect { background: #444b58; }
  #status { margin-left: auto; font-weight: 600; }
  #status.on { color: #5ad07a; } #status.off { color: #e85e75; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid #23262e;
           white-space: nowrap; }
  th { position: sticky; top: 0; background: #1d2027; cursor: default; font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover { background: #1f232b; }
  .name { font-weight: 500; }
  .type { color: #8b93a3; font-size: 12px; margin-left: 6px; }
  .muted { opacity: 0.45; }            /* not active/rendered */
  .cpu-hi { color: #e85e75; font-weight: 600; }
  .cpu-mid { color: #eabc48; }
  .cpu-low { color: #718cdc; }
  .meta { padding: 4px 16px; color: #8b93a3; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>OBS Source Profiler</h1>
  <input id="url" value="ws://localhost:4455" size="22" title="obs-websocket URL" />
  <input id="pw" type="password" placeholder="password (if set)" size="18" />
  <button id="connect">Connect</button>
  <span id="status" class="off">disconnected</span>
</header>
<div class="meta" id="meta">Waiting for data…</div>
<table>
  <thead>
    <tr>
      <th>Source</th><th>CPU %</th><th>GPU %</th><th>Total %</th>
      <th>Tick avg (ms)</th><th>Render avg (ms)</th><th>Render total (ms)</th><th>Async FPS</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<!-- obs-websocket-js handles the v5 Identify/auth handshake and reconnect.
     Pinned + SRI so a CDN compromise can't swap the script. -->
<script
  src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.8/dist/obs-ws.global.js"
  integrity="sha384-lY77rD++w3IGkFCrXckuC7IRv29rr92Bx9Ofo6vqsf4y3mFyPzWbHmNkCo5I3hbe"
  crossorigin="anonymous"></script>
<script>
  const EventSubscription = { General: 1 << 0, Vendors: 1 << 5 };
  // The global build exposes a module namespace; the class is on `.default`.
  const OBSWebSocketClass = window.OBSWebSocket.default || window.OBSWebSocket;
  const obs = new OBSWebSocketClass();

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const rowsEl = $('rows');
  const metaEl = $('meta');
  const connectBtn = $('connect');
  let connected = false;

  function setStatus(text, on) {
    statusEl.textContent = text;
    statusEl.className = on ? 'on' : 'off';
  }

  function fmt(n, d = 1) { return (n ?? 0).toFixed(d); }
  function cpuClass(p) { return p >= 100 ? 'cpu-hi' : p >= 50 ? 'cpu-mid' : p >= 25 ? 'cpu-low' : ''; }

  // Flatten the source tree into indented rows.
  function addRows(items, depth) {
    for (const it of items) {
      const tr = document.createElement('tr');
      if (!it.active && !it.rendered) tr.classList.add('muted');
      const indent = '&nbsp;'.repeat(depth * 4);
      const cpu = it.cpuPercentage ?? 0;
      tr.innerHTML =
        `<td class="name">${indent}${escapeHtml(it.name)}` +
          `<span class="type">${escapeHtml(it.sourceType || '')}</span></td>` +
        `<td class="${cpuClass(cpu)}">${fmt(cpu)}</td>` +
        `<td>${fmt(it.gpuPercentage)}</td>` +
        `<td>${fmt(it.totalPercentage)}</td>` +
        `<td>${fmt(it.tickAvg, 3)}</td>` +
        `<td>${fmt(it.renderAvg, 3)}</td>` +
        `<td>${fmt(it.renderTotal, 3)}</td>` +
        `<td>${it.async ? fmt(it.asyncRenderedFps) : ''}</td>`;
      rowsEl.appendChild(tr);
      if (it.children && it.children.length) addRows(it.children, depth + 1);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function render(data) {
    rowsEl.replaceChildren();
    addRows(data.sources || [], 0);
    metaEl.textContent =
      `${(data.sources || []).length} top-level sources · target frame time ` +
      `${fmt(data.frameTime, 2)} ms · updated ${new Date().toLocaleTimeString()}`;
  }

  // The plugin emits eventType "SourceStats" under vendorName "source-profiler".
  obs.on('VendorEvent', ({ vendorName, eventType, eventData }) => {
    if (vendorName === 'source-profiler' && eventType === 'SourceStats') render(eventData);
  });

  obs.on('ConnectionClosed', () => {
    connected = false;
    setStatus('disconnected', false);
    connectBtn.textContent = 'Connect';
    connectBtn.classList.remove('disconnect');
  });

  connectBtn.addEventListener('click', async () => {
    if (connected) { obs.disconnect(); return; }
    setStatus('connecting…', false);
    try {
      await obs.connect($('url').value, $('pw').value || undefined, {
        eventSubscriptions: EventSubscription.General | EventSubscription.Vendors,
      });
      connected = true;
      setStatus('connected', true);
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.add('disconnect');
    } catch (e) {
      setStatus('failed: ' + (e && e.message ? e.message : e), false);
    }
  });
</script>
</body>
</html>
